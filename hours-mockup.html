<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hours - Focus Tracker Mockup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: #f5f7fa;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .iphone {
            width: 280px;
            height: 580px;
            background: #1c1c1e;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .iphone::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 30px;
            background: #1c1c1e;
            border-radius: 0 0 20px 20px;
            z-index: 10;
        }

        .screen {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 32px;
            overflow: hidden;
            position: relative;
        }

        /* Screen 1 - Purple gradient ripples */
        .screen-1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .ripple {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
        }

        .ripple-1 {
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .ripple-2 {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .ripple-3 {
            width: 400px;
            height: 400px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .screen-1 h1 {
            color: white;
            font-size: 32px;
            font-weight: 600;
            text-align: center;
            padding: 0 40px;
            z-index: 5;
            position: relative;
            line-height: 1.3;
        }

        /* Screen 2 - Cards */
        .screen-2 {
            background: #f5f7fa;
            padding: 60px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            justify-content: center;
        }

        .card {
            border-radius: 16px;
            padding: 24px;
            color: #1a1a1a;
            font-size: 24px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.08);
            height: 100px;
            display: flex;
            align-items: center;
            background: white;
            border: 2px solid #e8ecf1;
        }

        .card-blue {
            border-color: #667eea;
            color: #667eea;
        }

        .card-red {
            border-color: #e8ecf1;
        }

        .card-green {
            border-color: #e8ecf1;
        }

        /* Screen 3 - Blurred blobs */
        .screen-3 {
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.6;
        }

        .blob-1 {
            width: 200px;
            height: 200px;
            background: #667eea;
            top: 10%;
            left: -20%;
        }

        .blob-2 {
            width: 180px;
            height: 180px;
            background: #764ba2;
            top: 40%;
            right: -15%;
        }

        .blob-3 {
            width: 160px;
            height: 160px;
            background: #ffd89b;
            bottom: 15%;
            left: 10%;
        }

        .screen-3 h2 {
            color: #1c1c1e;
            font-size: 26px;
            font-weight: 600;
            text-align: center;
            padding: 0 32px;
            z-index: 5;
            position: relative;
            line-height: 1.4;
        }

        /* Screen 4 - Timer */
        .screen-4 {
            background: #f5f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            gap: 40px;
        }

        .timer-picker {
            position: relative;
            width: 220px;
            height: 220px;
        }

        .timer-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: white;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 8px solid #667eea;
        }

        .timer-value {
            font-size: 48px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .timer-label {
            font-size: 16px;
            color: #64748b;
            font-weight: 500;
        }

        .begin-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 20px;
            font-weight: 600;
            padding: 16px 80px;
            border-radius: 28px;
            border: none;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.25);
            cursor: pointer;
        }

        @media (max-width: 1200px) {
            .container {
                gap: 20px;
            }

            .iphone {
                width: 240px;
                height: 500px;
            }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Screen 1: Blue ripples -->
        <div class="iphone">
            <div class="screen screen-1">
                <div class="ripple ripple-1"></div>
                <div class="ripple ripple-2"></div>
                <div class="ripple ripple-3"></div>
                <h1>Your hours<br>shape you</h1>
            </div>
        </div>

        <!-- Screen 2: Cards -->
        <div class="iphone">
            <div class="screen screen-2">
                <div class="card card-blue">Writing</div>
                <div class="card card-red">Design</div>
                <div class="card card-green">Study</div>
            </div>
        </div>

        <!-- Screen 3: Blurred blobs -->
        <div class="iphone">
            <div class="screen screen-3">
                <div class="blob blob-1"></div>
                <div class="blob blob-2"></div>
                <div class="blob blob-3"></div>
                <h2>Every hour spent is who you are—right now</h2>
            </div>
        </div>

        <!-- Screen 4: Timer -->
        <div class="iphone">
            <div class="screen screen-4">
                <div class="timer-picker">
                    <div class="timer-circle">
                        <div class="timer-value">60</div>
                        <div class="timer-label">minutes</div>
                    </div>
                </div>
                <button class="begin-button">Begin</button>
            </div>
        </div>
    </div>
</body>
</html>
